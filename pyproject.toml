[project]
name = "macropulse-sentinel"
version = "1.0.0"
description = "Async event-driven economic news monitor with LLM sentiment analysis and Telegram trade alerts"
requires-python = ">=3.9"
dependencies = [
    # Async HTTP & networking
    "aiohttp>=3.9",
    "aiofiles>=23.2",
    "httpx[http2]>=0.27",
    "websockets>=12.0",
    # Feed parsing
    "feedparser>=6.0",
    # Pydantic (settings + models)
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # ── FREE LLM providers ────────────────────────────────────────────────
    # Ollama (local, no key): pip install aiohttp already covers the REST calls
    # Gemini (free cloud, 1500 req/day, no CC):
    "google-generativeai>=0.7",
    # ── Optional paid LLM fallbacks ───────────────────────────────────────
    "groq>=0.9",
    "openai>=1.35",
    "anthropic>=0.30",
    # Telegram (bot token from @BotFather — always free)
    "python-telegram-bot>=21.0",
    # Twitter/X API (optional — Nitter RSS mode needs no key)
    "tweepy>=4.14",
    # ── FREE price feed ───────────────────────────────────────────────────
    # yfinance: Yahoo Finance polling, no API key required
    "yfinance>=0.2",
    # Resilience
    "tenacity>=8.3",
    # Config
    "python-dotenv>=1.0",
    # Logging
    "structlog>=24.2",
    "rich>=13.7",
    # Database / dedup
    "aiosqlite>=0.20",
    # Scheduling
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/macropulse"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
